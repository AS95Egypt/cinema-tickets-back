version: 1
project:
  name: CinemaTicketsBack
  primaryLanguage: typescript
  projectRoots:
    - .
tracker:
  type: github
  workspace: AS95Egypt
  project: cinema-tickets-back
naming:
  includeTrackerId: true
  globalSequence: true
agents: []
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
  modelOverride:
    anthropic: claude-sonnet-5
  stages:
    scout:
      enabled: true
      maxFiles: 12
      maxOutputTokens: 2048
  tools:
    grep: true
    listDir: true
    rangedRead: true
  validation:
    enabled: true
    strict: false
  runtime:
    anthropic: agent-sdk
  providerOptions:
    anthropic:
      thinking: adaptive
      effort: medium
      effortByPhase:
        scout: minimal
        draft: medium
